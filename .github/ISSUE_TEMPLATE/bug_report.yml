name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include API keys, service account JSON or private content.
        Security problems go through SECURITY.md, not a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: wp-version
    attributes:
      label: WordPress version
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
    validations:
      required: true
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options:
        - Block editor (Gutenberg)
        - Classic Editor (TinyMCE)
        - Both
        - Not editor related
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Extraction provider (primary / fallback)
      options:
        - Claude / OpenAI
        - OpenAI / Claude
        - Claude / None
        - OpenAI / None
        - Not relevant
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Lines starting with ILSEJ from wp-content/debug.log, with keys and private content removed.
      render: text
