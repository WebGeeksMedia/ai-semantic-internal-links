# Monthly, one grouped pull request per ecosystem (major versions included).
# Read the release notes of any major bump in the group before merging.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    groups:
      composer-all:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-all:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions-all:
        patterns:
          - "*"
    open-pull-requests-limit: 3
